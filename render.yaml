# Render Blueprint — https://render.com/docs/blueprint-spec
# In the Render dashboard: New -> Blueprint -> connect this repo -> Apply.
# Render reads this file automatically and provisions the service below.
services:
  - type: web
    name: phishguard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PHISHGUARD_TRUSTED_DOMAINS
        value: ""
      - key: PHISHGUARD_OPENAI_ENABLED
        value: "0"
