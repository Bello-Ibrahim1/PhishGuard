<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PhishGuard Settings</title>
  <style>
    :root{
      --pg-bg:#05070d; --pg-text:#f1f5f9; --pg-text-sub:#8b96ab; --pg-text-strong:#c7cfdd; --pg-text-faint:#5b6579;
      --pg-panel-solid:#0a0e1a; --pg-safe:#34d399;
      --pg-border:rgba(255,255,255,.08); --pg-border-input:rgba(255,255,255,.1);
      --pg-wash-1:rgba(255,255,255,.03);
    }
    /* Follows the OS/browser color scheme, same tokens/values as the in-page panel
       (overlay.css) and the popup — kept consistent so all three PhishGuard surfaces
       theme together instead of Settings staying stuck dark while the rest switches. */
    @media (prefers-color-scheme: light){
      :root{
        --pg-bg:#f4f6fb; --pg-text:#0f172a; --pg-text-sub:#475569; --pg-text-strong:#1e293b; --pg-text-faint:#64748b;
        --pg-panel-solid:#ffffff; --pg-safe:#047857;
        --pg-border:rgba(15,23,42,.10); --pg-border-input:rgba(15,23,42,.14);
        --pg-wash-1:rgba(15,23,42,.035);
      }
    }
    *{box-sizing:border-box}
    body{
      font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      padding:28px; max-width:460px; background:var(--pg-bg); color:var(--pg-text); margin:0;
    }
    .hdr{display:flex;align-items:center;gap:10px;margin-bottom:20px}
    .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6,#22d3ee);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px -4px rgba(99,102,241,.6)}
    .logo svg{width:20px;height:20px}
    h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
    .hdr .s{font-size:12px;color:var(--pg-text-sub);margin-top:1px}
    .card{background:var(--pg-wash-1);border:1px solid var(--pg-border);border-radius:16px;padding:18px;margin-bottom:14px}
    label{display:block;margin:0 0 6px;font-weight:600;font-size:12px;color:var(--pg-text-strong)}
    .hint{font-size:11px;color:var(--pg-text-faint);margin:5px 0 14px}
    input{
      width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--pg-border-input);
      background:var(--pg-panel-solid);color:var(--pg-text);box-sizing:border-box;font-size:13px;
    }
    input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.18)}
    button{
      margin-top:6px;padding:11px 18px;border-radius:11px;
      background:linear-gradient(135deg,#6366f1,#8b5cf6,#22d3ee);color:#fff;border:none;cursor:pointer;
      font-weight:700;font-size:13px;box-shadow:0 8px 20px -6px rgba(99,102,241,.5);
    }
    button:hover{filter:brightness(1.08)}
    .status{font-size:12px;color:var(--pg-safe);margin-top:10px;min-height:16px}
    .card.ready{padding:14px 18px}
    .ready-row{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--pg-text-strong)}
    details.advanced{padding:0;overflow:hidden}
    details.advanced summary{cursor:pointer;padding:14px 18px;font-size:12px;font-weight:700;color:var(--pg-text-sub);list-style:none}
    details.advanced summary::-webkit-details-marker{display:none}
    details.advanced summary::before{content:"›";display:inline-block;margin-right:6px;transition:transform .15s ease}
    details.advanced[open] summary::before{transform:rotate(90deg)}
    details.advanced .advanced-body{padding:0 18px 18px}
  </style>
</head>
<body>
  <div class="hdr">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5v6c0 5.2 3.4 9.7 8 11 4.6-1.3 8-5.8 8-11V5l-8-3z" fill="#fff"/><path d="M9 12.5l2 2 4-4.5" stroke="#4338ca" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div>
      <h2>PhishGuard Settings</h2>
      <div class="s">You're all set — no setup required</div>
    </div>
  </div>
  <div class="card ready">
    <div class="ready-row">
      <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><circle cx="12" cy="12" r="10" fill="var(--pg-safe)"/><path d="M8 12.5l2.5 2.5L16 9.5" stroke="var(--pg-panel-solid)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>PhishGuard is connected and ready to use.</span>
    </div>
  </div>
  <!-- The self-hosting Advanced section (API/Dashboard URL overrides) is not static markup
       here on purpose. options.js builds it on the fly, and only for the developer's own
       signed-in Chrome profile — see the ALLOWED_DEV_EMAILS check at the top of that file.
       Everyone else only ever sees the "ready" card above. -->
  <div id="advancedMount"></div>
</body>
<script src="options.js"></script>
</html>
